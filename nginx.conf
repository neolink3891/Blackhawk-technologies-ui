server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App link verification files (Sekro invite links): JSON, served as-is. Exact matches, so they never fall through
    # to the SPA fallback below; a missing file is a 404, never index.html or a redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        types { }
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        types { }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
